# Tests for the agent and for the deploy policy.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --only-binary :all: -r requirements.txt -r requirements-mcp.txt
      - run: python -m pytest tests -q

  lockfile:
    # The Docker image installs from demo-app/requirements.lock.
    # This job fails if someone changed requirements.txt and forgot to refresh the lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_lock.py

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Policy unit tests (OPA)
        run: docker run --rm -v "$PWD:/work" -w /work openpolicyagent/opa:latest test policy -v
