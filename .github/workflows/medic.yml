# Runs the agent whenever demo-ci fails.
name: medic

on:
  workflow_run:
    workflows: ["demo-ci"]
    types: [completed]

permissions:
  actions: write       # read the failed run and its logs, restart jobs after a network failure
  contents: write      # push the fix branch
  pull-requests: write # open the fix PR
  issues: write        # open an issue when there is no safe fix

jobs:
  fix:
    # Only for failed runs, and never for the agent's own fix branches (no endless loop).
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      !startsWith(github.event.workflow_run.head_branch, 'medic/')
    runs-on: ubuntu-latest
    steps:
      # The failing commit: this is the code the fix is verified against.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # The agent itself, always from the default branch, never from the branch being repaired.
      - uses: actions/checkout@v4
        with:
          path: .medic
      - uses: ./.medic
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-command: pip install -q -r demo-app/requirements.txt && python -m pytest demo-app -q --rootdir .
          llm-base-url: ${{ vars.LLM_BASE_URL }}
          llm-model: ${{ vars.LLM_MODEL }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
